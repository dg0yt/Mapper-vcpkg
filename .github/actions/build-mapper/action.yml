name: Build Mapper with vcpkg
description: "Builds and test Mapper"
inputs:
  target_triplet:
    required: true
    type: string
  host_triplet:
    required: true
    type: string
  restore_export:
    type: boolean
    default: true
  key:
    description: An identifier used in cache keys
    type: string
  label:
    description: A label controlling workflow behavior
    required: true
    type: string
  toolchain_file:
    required: true
    type: string
  cmake-args:
    type: string
    default: ""
outputs:
  label:
    description: "Workflow label"
    value: ${{ steps.setup.outputs.label }}
  package:
    description: "Cache key for package"
    value: ${{ steps.setup.outputs.package }}
runs:
  using: 'composite'
  steps:
    - name: Setup vcpkg
      id: setup-vcpkg
      if: ${{ inputs.label == '' }}
      uses: $/.github/actions/install-vcpkg
      with:
        target_triplet: ${{ inputs.target_triplet }}
        host_triplet: ${{ inputs.host_triplet }}
        restore_export: ${{ inputs.restore_export }}

    - name: Build system setup
      id: setup
      shell: bash
      env:
        LABEL: ${{ inputs.label }}
        KEY: ${{ inputs.key }}
        TOOLCHAIN_FILE: ${{ inputs.toolchain_file }}
        HOST_TRIPLET: ${{ inputs.host_triplet }}
        TARGET_TRIPLET: ${{ inputs.target_triplet }}
      run: |
        set -e
        cat << : | tee -a "$GITHUB_OUTPUT"
        label=${{ case(inputs.label == '', steps.setup-vcpkg.outputs.label, '${LABEL}') }}
        key=${{ case(inputs.label == '', steps.setup-vcpkg.outputs.key, '${KEY}') }}
        toolchain_file=${{ case(inputs.label == '', steps.setup-vcpkg.outputs.toolchain_file, '${TOOLCHAIN_FILE}') }}
        package=mapper-package_${{ case(inputs.label == '', steps.setup-vcpkg.outputs.key, '${KEY}') }}_${{ github.run_id }}
        :
        case "$RUNNER_OS" in
        macOS)
          brew install doxygen
          brew --prefix
          # https://github.com/microsoft/vcpkg/issues/48417 ?
          if test -d /usr/local/include && test "$RUNNER_ARCH" == "X64"
          then
            sudo mv /usr/local/include /usr/local/include-no-default
          fi
          echo "#include <jconfig.h>"  | cc -E - || echo GOTCHA
          ;;
        Linux)
          sudo apt-get update
          sudo apt-get install doxygen
          ;;
        Windows)
          choco install --no-progress nsis
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
          case "$HOST_TRIPLET,$TARGET_TRIPLET" in
          x64-*,x64-*)
            echo 'CALL_VCVARSALL=call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ' x64 >> "$GITHUB_ENV"
            ;;
          *)
            echo "Unsupported triplet combination: $HOST_TRIPLET,$TARGET_TRIPLET"
            exit 1
            ;;
          esac
          ;;
        esac

    - name: Restore gradle cache
      id: restore-gradle
      if: contains(inputs.target_triplet, 'android')
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: git checkout Mapper
      if: steps.setup.outputs.label == 'vcpkg'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        repository: dg0yt/Mapper
        path: Mapper

    - name: Configure Mapper
      shell: bash
      env:
        CMAKE_ARGS: ${{ inputs.cmake-args }}
        HOST_TRIPLET: ${{ inputs.host_triplet }}
        TARGET_TRIPLET: ${{ inputs.target_triplet }}
        WORKFLOW_MAPPER_DIR: ${{ case(steps.setup.outputs.label == 'vcpkg', 'Mapper', '.') }}
        CHAINLOAD_TOOLCHAIN_FILE: ${{ steps.setup.outputs.toolchain_file }}
      run: |
        set -e
        mkdir build
        ${{ case(contains(inputs.target_triplet, 'windows'), 'cat << : | cmd /D /E:ON /V:OFF /K echo off', '') }}
        ${{ case(contains(inputs.target_triplet, 'windows'), '$CALL_VCVARSALL', '') }}
        cmake -S "${WORKFLOW_MAPPER_DIR}" -B build \
          -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg-export/scripts/buildsystems/vcpkg.cmake \
          -DCMAKE_CROSSCOMPILING=${{ case(inputs.target_triplet != inputs.host_triplet, 'ON', 'OFF') }} \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_POLICY_DEFAULT_CMP0176=NEW \
          -DCMAKE_POLICY_DEFAULT_CMP0177=NEW \
          -DCMAKE_SUPPRESS_REGENERATION=ON \
          -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$CHAINLOAD_TOOLCHAIN_FILE \
          -DVCPKG_TARGET_TRIPLET=$TARGET_TRIPLET \
          -DVCPKG_HOST_TRIPLET=$HOST_TRIPLET \
          -DVCPKG_MANIFEST_MODE=OFF \
          -DLICENSING_PROVIDER=vcpkg \
          ${{ case(contains(inputs.target_triplet, 'android'), '-DANDROID_DEPLOY_QT=$GITHUB_WORKSPACE/vcpkg-export/installed/$TARGET_TRIPLET/tools/qt5/bin/androiddeployqt', '') }} \
          $CMAKE_ARGS \
          || exit 1
        :

    - name: Build Mapper
      shell: bash
      run: |
        set -e
        ${{ case(contains(inputs.target_triplet, 'windows'), 'cat << : | cmd /D /E:ON /V:OFF /K echo off', '') }}
        ${{ case(contains(inputs.target_triplet, 'windows'), '$CALL_VCVARSALL', '') }}
        cmake --build build
        :

    - name: Run Mapper tests
      shell: bash
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
        DYLD_LIBRARY_PATH: ${{ github.workspace }}/vcpkg-export/installed/${{ inputs.target_triplet }}/lib
        LD_LIBRARY_PATH: ${{ github.workspace }}/vcpkg-export/installed/${{ inputs.target_triplet }}/lib
        GDAL_DATA: ${{ github.workspace }}/vcpkg-export/installed/${{ inputs.target_triplet }}/share/gdal
        PROJ_DATA: ${{ github.workspace }}/vcpkg-export/installed/${{ inputs.target_triplet }}/share/proj
        TARGET_TRIPLET: ${{ inputs.target_triplet }}
        SKIP_POWERSHELL_POSITION_SOURCE_LIVE_TEST: 1
        # Needs Qt 6.5
        QT_WIN_DEBUG_CONSOLE: attach
      run: |
        set -e
        ${{ case(contains(inputs.target_triplet, 'windows'), 'cat << : | cmd /D /E:ON /V:OFF /K echo off', '') }}
        ${{ case(contains(inputs.target_triplet, 'windows'), 'set PATH=%GITHUB_WORKSPACE%\vcpkg-export\installed\%TARGET_TRIPLET%\bin;%PATH%', '') }}
        ${{ case(contains(inputs.target_triplet, 'windows'), 'set QT_PLUGIN_PATH=%GITHUB_WORKSPACE%\vcpkg-export\installed\%TARGET_TRIPLET%\plugins', '') }}
        ${{ case(contains(inputs.target_triplet, 'windows'), '$CALL_VCVARSALL', '') }}
        ${{ case(contains(inputs.target_triplet, 'windows'), 'mkdir build\test\lib\fonts', '') }}
        ctest --test-dir build --output-on-failure --timeout 60
        :

    # Separate step because the DMG unmount is unreliable
    - name: Build Mapper package
      shell: bash
      run: |
        set -e
        ${{ case(contains(inputs.target_triplet, 'windows'), 'cat << : | cmd /D /E:ON /V:OFF /K echo off', '') }}
        ${{ case(contains(inputs.target_triplet, 'windows'), '$CALL_VCVARSALL', '') }}
        cmake --build build --target package
        :

    - name: Save Mapper packages to cache
      #if: ${{ steps.setup.outputs.label == 'mapper' }}
      uses: actions/cache/save@v5
      with:
        path: build/OpenOrienteering-Mapper-*
        key: ${{ steps.setup.outputs.package }}
        enableCrossOsArchive: true

    - name: Save gradle cache
      if: contains(inputs.target_triplet, 'android') && steps.restore-gradle.outputs.cache-matched-key == ''
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ steps.restore-gradle.outputs.cache-primary-key }}
