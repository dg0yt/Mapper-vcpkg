name: Install dependencies with vcpkg
description: "Installs the required dependencies"
inputs:
  target_triplet:
    required: true
    type: string
  host_triplet:
    required: true
    type: string
  restore_export:
    type: boolean
    default: true
outputs:
  key:
    description: "Cache key"
    value: ${{ steps.vcpkg-configuration.outputs.key }}
  label:
    description: "Workflow label"
    value: ${{ steps.workflow-configuration.outputs.label }}
  toolchain_file:
    description: "CMake toolchain file path"
    value: ${{ steps.vcpkg-configuration.outputs.toolchain_file }}
runs:
  using: "composite"
  steps:
    - name: Determine workflow configuration
      id: workflow-configuration
      shell: bash
      run: |
        set -e
        if test -f .github/WORKFLOW_LABEL && grep -q 'vcpkg' .github/WORKFLOW_LABEL
        then
          LABEL=vcpkg
          VCPKG_DIR=
        else
          LABEL=mapper
          VCPKG_DIR=Mapper-vcpkg
        fi
        cat << : | tee -a "$GITHUB_OUTPUT"
          label=$LABEL
          vcpkg_dir=$VCPKG_DIR
        :

    - name: git checkout Mapper-vcpkg
      if: ${{ steps.workflow-configuration.outputs.label != 'vcpkg' }}
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        repository: dg0yt/Mapper-vcpkg
        path: ${{ steps.workflow-configuration.outputs.vcpkg_dir }}

    - name: Determine vcpkg configuration
      id: vcpkg-configuration
      shell: bash
      env:
        HOST_TRIPLET: ${{ inputs.host_triplet }}
        TARGET_TRIPLET: ${{ inputs.target_triplet }}
        WORKFLOW_VCPKG_DIR: ${{ steps.workflow-configuration.outputs.vcpkg_dir }}
      run: |
        set -e
        test -z '${{ steps.workflow-configuration.outputs.label }}' || exit 1
        test -z "$WORKFLOW_VCPKG_DIR" || cd "$WORKFLOW_VCPKG_DIR"
        CONFIGURATION=$(
          find vcpkg.json vcpkg-configuration.json overlay-ports overlay-triplets -type f -exec sha1sum '{}' ';' |
          sed -e '/overlay-triplets[/]/ {' -e "/[/]$HOST_TRIPLET[.]cmake/ p" -e "/[/]$TARGET_TRIPLET[.]cmake/ p" -e 'd' -e '}' |
          sort -u )
        echo "$CONFIGURATION"
        HASH=$( echo "$CONFIGURATION" | sha1sum | ( read HASH FILE; echo "$HASH" ) )

        case "$TARGET_TRIPLET" in
        *-android*)
          TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg-export/scripts/toolchains/android.cmake"
          ;;
        *-linux*)
          TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg-export/scripts/toolchains/linux.cmake"
          ;;
        *-osx*)
          TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg-export/scripts/toolchains/osx.cmake"
          ;;
        *-windows*)
          TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg-export/scripts/toolchains/windows.cmake"
          ;;
        *)
          TOOLCHAIN_FILE="unknown-vcpkg-toolchain-file"
          ;;
        esac

        cat << : | tee -a "$GITHUB_OUTPUT"
          hash=${HASH}
          key=${HOST_TRIPLET}_${TARGET_TRIPLET}_${HASH}
          toolchain_file=${TOOLCHAIN_FILE}
        :

    - name: Restore vcpkg export
      id: restore-export
      if: ${{ steps.workflow-configuration.outputs.label != 'vcpkg' || inputs.restore_export }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/vcpkg-export
        key: vcpkg-export_${{ steps.vcpkg-configuration.outputs.key }}

    - name: Restore vcpkg assets
      id: restore-assets
      if: ${{ steps.workflow-configuration.outputs.label == 'vcpkg' || steps.restore-export.outputs.cache-hit != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: cache/downloads
        key: vcpkg-assets_${{ steps.vcpkg-configuration.outputs.key }}_success
        restore-keys: |
          vcpkg-assets_${{ steps.vcpkg-configuration.outputs.key }}_
          vcpkg-assets_${{ inputs.host_triplet }}_${{ inputs.target_triplet }}_
          vcpkg-assets_${{ inputs.host_triplet }}_
          vcpkg-assets_
        enableCrossOsArchive: true

    - name: Restore vcpkg artifacts
      if: ${{ steps.restore-export.outputs.cache-hit != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: cache/artifacts
        key: vcpkg-cache_${{ steps.vcpkg-configuration.outputs.key }}_${{ github.run_id }}
        restore-keys: |
          vcpkg-cache_${{ steps.vcpkg-configuration.outputs.key }}_
          vcpkg-cache_${{ inputs.host_triplet }}_${{ inputs.target_triplet }}_
          vcpkg-cache_${{ inputs.host_triplet }}_

    - name: Install transitive system dependencies
      if: ${{ steps.restore-export.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -e
        case "$RUNNER_OS" in
        macOS)
          brew install \
            autoconf autoconf-archive automake libtool
          # https://github.com/microsoft/vcpkg/issues/48417 ?
          if test -d /usr/local/include && test "$RUNNER_ARCH" == "X64"
          then
            sudo mv /usr/local/include /usr/local/include-no-default
          fi
          echo "#include <jconfig.h>"  | cc -E - || echo GOTCHA
          ;;
        Linux)
          sudo apt-get update
          sudo apt-get install \
            autoconf autoconf-archive automake libtool \
            libltdl-dev \
            mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev libgles2-mesa-dev \
            libx11-dev \
            libxaw7-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxt-dev \
            libxxf86vm-dev \
            xutils-dev \
            libxext-dev libxfixes-dev libxrender-dev \
            libxcb1-dev libx11-xcb-dev libxcb-glx0-dev libxcb-util0-dev \
            libxkbcommon-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xinput-dev \
            libxcb-cursor-dev \
            libxtst-dev
          ;;
        esac

    - name: vcpkg install --triplet=${{ inputs.target_triplet }}
      id: vcpkg-install
      if: ${{ steps.restore-export.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        HOST_TRIPLET: ${{ inputs.host_triplet }}
        TARGET_TRIPLET: ${{ inputs.target_triplet }}
        VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/cache/artifacts
        VCPKG_DOWNLOADS: ${{ github.workspace }}/cache/downloads
        WORKFLOW_VCPKG_DIR: ${{ steps.workflow-configuration.outputs.vcpkg_dir }}
      run: |
        set -e
        mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
        mkdir -p "$VCPKG_DOWNLOADS"
        test -z "$WORKFLOW_VCPKG_DIR" || cd "$WORKFLOW_VCPKG_DIR"
        vcpkg install --host-triplet="$HOST_TRIPLET" --triplet="$TARGET_TRIPLET" --only-downloads --no-binarycaching --x-install-root="$GITHUB_WORKSPACE/only_downloads"
        vcpkg install --host-triplet="$HOST_TRIPLET" --triplet="$TARGET_TRIPLET" --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed"

    - name: Cleanup
      if: ${{ steps.restore-export.outputs.cache-hit != 'true' && always() }}
      shell: bash
      run: |
        set -e
        rm -Rf cache/downloads/tools

    - name: Save vcpkg assets
      if: ${{ steps.restore-export.outputs.cache-hit != 'true' && always() }}
      uses: actions/cache/save@v5
      with:
        path: cache/downloads
        key: vcpkg-assets_${{ steps.vcpkg-configuration.outputs.key }}_${{ steps.vcpkg-install.outcome }}
        enableCrossOsArchive: true

    - name: Save vcpkg artifacts
      if: ${{ steps.restore-export.outputs.cache-hit != 'true' && always() }}
      uses: actions/cache/save@v5
      with:
        path: cache/artifacts
        key: vcpkg-cache_${{ steps.vcpkg-configuration.outputs.key }}_${{ github.run_id }}

    - name: vcpkg export
      shell: bash
      env:
        WORKFLOW_VCPKG_DIR: ${{ steps.workflow-configuration.outputs.vcpkg_dir }}
      run: |
        set -e
        test -z "$WORKFLOW_VCPKG_DIR" || cd "$WORKFLOW_VCPKG_DIR"
        vcpkg export --raw --output-dir="$GITHUB_WORKSPACE" --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed"
        cd "$GITHUB_WORKSPACE"
        mv vcpkg-export-* vcpkg-export
        cp -a $(cd "$VCPKG_INSTALLATION_ROOT"; pwd)/scripts/toolchains vcpkg-export/scripts

    - name: Save vcpkg export
      uses: actions/cache/save@v5
      with:
        path: ${{ github.workspace }}/vcpkg-export
        key: vcpkg-export_${{ steps.vcpkg-configuration.outputs.key }}
