name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      restore_export:
        description: 'Restore vcpkg export from cache'
        type: boolean
        default: true
      target_pattern:
        description: 'Build jobs matching this pattern'
        type: string
        default: "^"
      upload-assets:
        description: 'Upload'
        type: boolean
        default: false
  workflow_call:
    inputs:
      restore_export:
        type: boolean
        default: true
      target_pattern:
        description: 'Build jobs matching this pattern'
        type: string
        default: "^"
  # Keep cache alive
  schedule:
    - cron: '10 21 * * 2,5'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  arm64-android:
    if: ${{ contains('^arm64-android$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: ubuntu-24.04
      target-triplet: arm64-android-dynamic-release
      host-triplet: x64-linux-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}
      cmake-args: >-
        -DANDROID_ABI=arm64-v8a
        -DANDROID_MIN_SDK_VERSION=24
        -DANDROID_TARGET_SDK_VERSION=28
        -DANDROID_SDK=/usr/local/lib/android/sdk
        -DANDROID_SDK_BUILD_TOOLS_REVISION=34
        -DCMAKE_SYSTEM_VERSION=24
    secrets:
      ARTIFACTS_KEY: ${{ secrets.ARTIFACTS_KEY }}

  arm64-macos:
    if: ${{ contains('^arm64-macos$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: macos-15
      target-triplet: arm64-osx-dynamic-release
      host-triplet: arm64-osx-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}
      cmake-args: >-
        -DMapper_SYSTEM_NAME=macOS-arm64
    secrets:
      ARTIFACTS_KEY: ${{ secrets.ARTIFACTS_KEY }}

  x64-android:
    if: ${{ contains('^x64-android$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: ubuntu-24.04
      target-triplet: x64-android-dynamic-release
      host-triplet: x64-linux-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}
      cmake-args: >-
        -DANDROID_ABI=x86_64
        -DANDROID_MIN_SDK_VERSION=24
        -DANDROID_TARGET_SDK_VERSION=28
        -DANDROID_SDK=/usr/local/lib/android/sdk
        -DANDROID_SDK_BUILD_TOOLS_REVISION=34
        -DCMAKE_SYSTEM_VERSION=24
    secrets:
      ARTIFACTS_KEY: ${{ secrets.ARTIFACTS_KEY }}

  x64-linux:
    if: ${{ contains('^x64-linux$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: ubuntu-24.04
      target-triplet: x64-linux-dynamic-release
      host-triplet: x64-linux-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}
    secrets:
      ARTIFACTS_KEY: ${{ secrets.ARTIFACTS_KEY }}

  x64-linux-debug:
    if: ${{ contains('^x64-linux-debug$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: ubuntu-24.04
      target-triplet: x64-linux-dynamic-release
      host-triplet: x64-linux-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}
      cmake-args: >+
        -DCMAKE_BUILD_TYPE=Debug
    secrets:
      ARTIFACTS_KEY: ${{ secrets.ARTIFACTS_KEY }}

  x64-macos:
    if: ${{ contains('^x64-macos$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: macos-15-intel
      target-triplet: x64-osx-dynamic-release
      host-triplet: x64-osx-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}
      cmake-args: 
        -DMapper_SYSTEM_NAME=macOS-x64
    secrets:
      ARTIFACTS_KEY: ${{ secrets.ARTIFACTS_KEY }}

  x64-windows:
    if: ${{ contains('^x64-windows$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: windows-2025-vs2026
      target-triplet: x64-windows-dynamic-release
      host-triplet: x64-windows-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}
      cmake-args: 
        -DVCPKG_CRT_LINKAGE=dynamic
        -DCMAKE_C_COMPILER=cl
        -DCMAKE_CXX_COMPILER=cl
    secrets:
      ARTIFACTS_KEY: ${{ secrets.ARTIFACTS_KEY }}

  upload-assets:
    name: Upload source assets
    needs: [ arm64-android, arm64-macos, x64-android, x64-macos, x64-linux, x64-windows ]
    if: ${{ needs.x64-linux.outputs.label == 'vcpkg' }}
    runs-on: ubuntu-24.04
    environment: Release
    permissions:
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v6.1.0
      with:
        persist-credentials: false
    - name: Restore arm64-android assets
      if: false
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ github.workspace }}/cache/downloads
        key: vcpkg-cache_${{ needs.arm64-android.outputs.key }}
        fail-on-cache-miss: true
    - name: Restore arm64-macos assets
      if: false
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ github.workspace }}/cache/downloads
        key: vcpkg-cache_${{ needs.arm64-macos.outputs.key }}
        fail-on-cache-miss: true
    - name: Restore x64-linux assets
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ github.workspace }}/cache/downloads
        key: vcpkg-cache_${{ needs.x64-linux.outputs.key }}
        fail-on-cache-miss: true
    - name: Restore x64-windows assets
      if: false
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ github.workspace }}/cache/downloads
        key: vcpkg-cache_${{ needs.x64-windows.outputs.key }}
        fail-on-cache-miss: true
    - name: run script
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        rm ${{ github.workspace }}/cache/downloads/msys2-*
        gh release create --draft --title assets-collection || true
        gh release upload --clobber assets-collection ${{ github.workspace }}/cache/downloads/*

  upload-packages:
    name: Upload Mapper packages
    needs: [ arm64-android, arm64-macos, x64-android, x64-macos, x64-linux, x64-windows ]
    if: ${{ needs.x64-linux.outputs.label == 'mapper' || needs.x64-linux.outputs.label == 'vcpkg' }}
    runs-on: ubuntu-24.04
    environment: Release
    permissions:
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v6.1.0
      with:
        persist-credentials: false
    - name: Restore arm64-android packages
      uses: actions/cache/restore@v5
      with:
        path: build/OpenOrienteering-Mapper-*
        key: mapper-package_${{ needs.arm64-android.outputs.key }}
        fail-on-cache-miss: true
    - name: Restore arm64-macos packages
      uses: actions/cache/restore@v5
      with:
        path: build/OpenOrienteering-Mapper-*
        key: mapper-package_${{ needs.arm64-macos.outputs.key }}
        fail-on-cache-miss: true
    - name: Restore x64-android packages
      uses: actions/cache/restore@v5
      with:
        path: build/OpenOrienteering-Mapper-*
        key: mapper-package_${{ needs.x64-android.outputs.key }}
        fail-on-cache-miss: true
    - name: Restore x64-macos packages
      uses: actions/cache/restore@v5
      with:
        path: build/OpenOrienteering-Mapper-*
        key: mapper-package_${{ needs.x64-macos.outputs.key }}
        fail-on-cache-miss: true
    - name: Restore x64-linux packages
      uses: actions/cache/restore@v5
      with:
        path: build/OpenOrienteering-Mapper-*
        key: mapper-package_${{ needs.x64-linux.outputs.key }}
        fail-on-cache-miss: true
    - name: Restore x64-windows packages
      uses: actions/cache/restore@v5
      with:
        path: build/OpenOrienteering-Mapper-*
        key: mapper-package_${{ needs.x64-windows.outputs.key }}
        fail-on-cache-miss: true
    - name: Upload
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create --draft --title Mapper-draft Mapper-draft || true
        gh release upload --clobber Mapper-draft ${{ github.workspace }}/build/OpenOrienteering-Mapper-*
