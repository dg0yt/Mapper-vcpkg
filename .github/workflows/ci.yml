name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      restore_export:
        description: 'Restore vcpkg export from cache'
        type: boolean
        default: true
      target_pattern:
        description: 'Build jobs matching this pattern'
        type: string
        default: "^"
      upload-assets:
        description: 'Upload'
        type: boolean
        default: false
  workflow_call:
    inputs:
      restore_export:
        type: boolean
        default: true
      target_pattern:
        description: 'Build jobs matching this pattern'
        type: string
        default: "^"
  # Keep cache alive
  schedule:
    - cron: '10 21 * * 2,5'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  arm64-android:
    if: ${{ contains('^arm64-android$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: ubuntu-24.04
      target-triplet: arm64-android-dynamic-release
      host-triplet: x64-linux-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}
      cmake-args: >-
        -DANDROID_ABI=arm64-v8a
        -DANDROID_MIN_SDK_VERSION=24
        -DANDROID_TARGET_SDK_VERSION=28
        -DANDROID_SDK=/usr/local/lib/android/sdk
        -DANDROID_SDK_BUILD_TOOLS_REVISION=34
        -DCMAKE_SYSTEM_VERSION=24

  arm64-macos:
    if: ${{ contains('^arm64-macos$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: macos-15
      target-triplet: arm64-osx-dynamic-release
      host-triplet: arm64-osx-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}
      cmake-args: >-
        -DMapper_SYSTEM_NAME=macOS-arm64

  x64-android:
    if: ${{ contains('^x64-android$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: ubuntu-24.04
      target-triplet: x64-android-dynamic-release
      host-triplet: x64-linux-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}
      cmake-args: >-
        -DANDROID_ABI=x86_64
        -DANDROID_MIN_SDK_VERSION=24
        -DANDROID_TARGET_SDK_VERSION=28
        -DANDROID_SDK=/usr/local/lib/android/sdk
        -DANDROID_SDK_BUILD_TOOLS_REVISION=34
        -DCMAKE_SYSTEM_VERSION=24

  x64-linux:
    if: ${{ false && contains('^x64-linux$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: ubuntu-24.04
      target-triplet: x64-linux-dynamic-release
      host-triplet: x64-linux-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}

  x64-linux-debug:
    if: ${{ contains('^x64-linux-debug$', inputs.target_pattern) }}
    runs-on: ubuntu-24.04
    env:
      TARGET_TRIPLET: x64-linux-dynamic-release
      HOST_TRIPLET:   x64-linux-dynamic-release
    steps:
      - name: git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install vcpkg packages
        id: install-vcpkg
        uses: ./.github/actions/install-vcpkg
        with:
          target-triplet: ${{ env.TARGET_TRIPLET }}
          host-triplet: ${{ env.HOST_TRIPLET }}
          restore_export: ${{ inputs.restore_export != false }}
      - name: Build Mapper
        id: build-mapper
        uses: ./.github/actions/build-mapper
        with:
          target-triplet: ${{ env.TARGET_TRIPLET }}
          host-triplet: ${{ env.HOST_TRIPLET }}
          key: ${{ steps.install-vcpkg.outputs.key }}
          label: ${{ steps.install-vcpkg.outputs.label }}
          toolchain-file: ${{ steps.install-vcpkg.outputs.toolchain-file }}
          cmake-args: >+
            -DCMAKE_BUILD_TYPE=Debug

  x64-macos:
    if: ${{ contains('^x64-macos$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: macos-15-intel
      target-triplet: x64-osx-dynamic-release
      host-triplet: x64-osx-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}
      cmake-args: 
        -DMapper_SYSTEM_NAME=macOS-x64

  x64-windows:
    if: ${{ contains('^x64-windows$', inputs.target_pattern) }}
    uses: $/.github/workflows/vcpkg.yml
    with:
      runner: windows-2025-vs2026
      target-triplet: x64-windows-dynamic-release
      host-triplet: x64-windows-dynamic-release
      restore_export: ${{ inputs.restore_export != false }}
      cmake-args: 
        -DVCPKG_CRT_LINKAGE=dynamic
        -DCMAKE_C_COMPILER=cl
        -DCMAKE_CXX_COMPILER=cl

  upload-assets:
    name: Upload source assets
    needs: [ arm64-android, arm64-macos, x64-android, x64-macos, x64-windows ]
    if: ${{ needs.arm64-macos.outputs.label == 'vcpkg' }}
    runs-on: ubuntu-24.04
    environment: Release
    permissions:
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v6.1.0
      with:
        persist-credentials: false
    # Restoring assets without run_id:
    # - Not every build produces a vcpkg-cache.
    # - The key sufficiently identifies the assets (inputs) from a previous run.
    - name: Restore arm64-android assets
      uses: actions/cache/restore@v5
      with:
        path: cache/downloads
        key: vcpkg-assets_${{ needs.arm64-android.outputs.key }}_complete
        fail-on-cache-miss: true
    - name: Restore arm64-macos assets
      uses: actions/cache/restore@v5
      with:
        path: cache/downloads
        key: vcpkg-assets_${{ needs.arm64-macos.outputs.key }}_complete
        fail-on-cache-miss: true
    - name: Restore x64-android assets
      uses: actions/cache/restore@v5
      with:
        path: cache/downloads
        key: vcpkg-assets_${{ needs.x64-android.outputs.key }}_complete
        fail-on-cache-miss: true
    - name: Restore x64-osx assets
      uses: actions/cache/restore@v5
      with:
        path: cache/downloads
        key: vcpkg-assets_${{ needs.x64-macos.outputs.key }}_complete
        fail-on-cache-miss: true
    - name: Restore x64-windows assets
      uses: actions/cache/restore@v5
      with:
        path: cache/downloads
        key: vcpkg-assets_${{ needs.x64-windows.outputs.key }}_complete
        fail-on-cache-miss: true
    - name: run script
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        rm cache/downloads/msys2-* || true
        rm -Rf cache/downloads/tools
        echo gh release create --draft --title assets-collection assets-collection || true
        echo gh release upload --clobber assets-collection cache/downloads/*

  upload-packages:
    name: Upload Mapper packages
    needs: [ arm64-android, arm64-macos, x64-android, x64-macos, x64-windows ]
    if: ${{ needs.arm64-macos.outputs.label == 'mapper' || needs.arm64-macos.outputs.label == 'vcpkg' }}
    runs-on: ubuntu-24.04
    environment: Release
    permissions:
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v6.1.0
      with:
        persist-credentials: false
    # Restoring packages with key and run_id:
    # We want the exact outputs from this run's build.
    - name: Restore arm64-android packages
      uses: actions/cache/restore@v5
      with:
        path: build/OpenOrienteering-Mapper-*
        key: mapper-package_${{ needs.arm64-android.outputs.key }}_${{ needs.arm64-android.outputs.run_id }}
        fail-on-cache-miss: true
    - name: Restore arm64-macos packages
      uses: actions/cache/restore@v5
      with:
        path: build/OpenOrienteering-Mapper-*
        key: mapper-package_${{ needs.arm64-macos.outputs.key }}_${{ needs.arm64-macos.outputs.run_id }}
        fail-on-cache-miss: true
    - name: Restore x64-android packages
      uses: actions/cache/restore@v5
      with:
        path: build/OpenOrienteering-Mapper-*
        key: mapper-package_${{ needs.x64-android.outputs.key }}_${{ needs.x64-android.outputs.run_id }}
        fail-on-cache-miss: true
    - name: Restore x64-macos packages
      uses: actions/cache/restore@v5
      with:
        path: build/OpenOrienteering-Mapper-*
        key: mapper-package_${{ needs.x64-macos.outputs.key }}_${{ needs.x64-macos.outputs.run_id }}
        fail-on-cache-miss: true
    - name: Restore x64-windows packages
      uses: actions/cache/restore@v5
      with:
        path: build/OpenOrienteering-Mapper-*
        key: mapper-package_${{ needs.x64-windows.outputs.key }}_${{ needs.x64-windows.outputs.run_id }}
        fail-on-cache-miss: true
    - name: Upload
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo gh release create --draft --title Mapper-draft Mapper-draft || true
        echo gh release upload --clobber Mapper-draft ${{ github.workspace }}/build/OpenOrienteering-Mapper-*
