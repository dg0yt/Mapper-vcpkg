name: Build with vcpkg

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target-triplet:
        required: true
        type: string
      host-triplet:
        required: true
        type: string
      restore_export:
        type: boolean
        default: true
      cmake-args:
        type: string
        default: ""
    outputs:
      key:
        description: "Cache key"
        value: ${{ jobs.vcpkg.outputs.key }}
      label:
        description: "Workflow label"
        value: ${{ jobs.vcpkg.outputs.label }}
      run_id:
        description: "GitHub run ID"
        value: ${{ jobs.vcpkg.outputs.run_id }}

env:
  RUNNER: ${{ inputs.runner }}
  UPLOAD_ARTIFACTS: ${{ case(secrets.ARTIFACTS_KEY == '', 0, 1) }}
  HOST_TRIPLET: ${{ inputs.host-triplet }}
  TARGET_TRIPLET: ${{ inputs.target-triplet }}
  VERBOSE: 1

jobs:
  vcpkg:
    outputs:
      key: ${{ steps.install-vcpkg.outputs.key }}
      label: ${{ steps.install-vcpkg.outputs.label }}
      run_id: ${{ github.run_id }}

    strategy:
      fail-fast: false

    runs-on: "${{ inputs.runner }}"

    defaults:
      run:
        shell: bash

    steps:
      - name: git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install vcpkg packages
        id: install-vcpkg
        uses: ./.github/actions/install-vcpkg
        with:
          target-triplet: ${{ inputs.target-triplet }}
          host-triplet: ${{ inputs.host-triplet }}
          restore_export: ${{ inputs.restore_export }}

      - name: Build Mapper
        id: build-mapper
        uses: ./.github/actions/build-mapper
        with:
          target-triplet: ${{ inputs.target-triplet }}
          host-triplet: ${{ inputs.host-triplet }}
          key: ${{ steps.install-vcpkg.outputs.key }}
          label: ${{ steps.install-vcpkg.outputs.label }}
          toolchain-file: ${{ steps.install-vcpkg.outputs.toolchain-file }}
          cmake-args: ${{ inputs.cmake-args }}
