name: Build with vcpkg

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target-triplet:
        required: true
        type: string
      host-triplet:
        required: true
        type: string
      restore_export:
        type: boolean
        default: true
      cmake-args:
        type: string
        default: ""
    outputs:
      key:
        description: "Cache key"
        value: ${{ jobs.vcpkg.outputs.key }}
      label:
        description: "Workflow label"
        value: ${{ jobs.vcpkg.outputs.label }}
      run_id:
        description: "GitHub run ID"
        value: ${{ jobs.vcpkg.outputs.run_id }}
    secrets:
      ARTIFACTS_KEY:
        required: false

env:
  RUNNER: ${{ inputs.runner }}
  UPLOAD_ARTIFACTS: ${{ case(secrets.ARTIFACTS_KEY == '', 0, 1) }}
  HOST_TRIPLET: ${{ inputs.host-triplet }}
  TARGET_TRIPLET: ${{ inputs.target-triplet }}
  VERBOSE: 1

jobs:
  vcpkg:
    outputs:
      key: ${{ steps.install-vcpkg.outputs.key }}
      label: ${{ steps.install-vcpkg.outputs.label }}
      run_id: ${{ github.run_id }}

    strategy:
      fail-fast: false

    runs-on: "${{ inputs.runner }}"

    defaults:
      run:
        shell: bash

    steps:
      - name: git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install vcpkg packages
        id: install-vcpkg
        uses: ./.github/actions/install-vcpkg
        with:
          target-triplet: ${{ inputs.target-triplet }}
          host-triplet: ${{ inputs.host-triplet }}
          restore_export: ${{ inputs.restore_export }}

      - name: General build system configuration
        run: |
          case "$RUNNER_OS" in
          macOS)
            brew install doxygen
            brew --prefix
            # https://github.com/microsoft/vcpkg/issues/48417 ?
            if test -d /usr/local/include && test "$RUNNER_ARCH" == "X64"
            then
              sudo mv /usr/local/include /usr/local/include-no-default
            fi
            echo "#include <jconfig.h>"  | cc -E - || echo GOTCHA
            ;;
          Linux)
            sudo apt-get update
            sudo apt-get install doxygen
            ;;
          Windows)
            choco install --no-progress nsis
            echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
            case "$HOST_TRIPLET,$TARGET_TRIPLET" in
            x64-*,x64-*)
              echo 'CALL_VCVARSALL=call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ' x64 >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported triplet combination: $HOST_TRIPLET,$TARGET_TRIPLET"
              exit 1
            esac
            ;;
          esac

      - name: Restore gradle cache
        id: restore-gradle
        if: contains(inputs.target-triplet, 'android')
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: git checkout Mapper
        if: steps.install-vcpkg.outputs.label == 'vcpkg'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: dg0yt/Mapper
          path: Mapper


      - name: Configure Mapper
        env:
          CMAKE_ARGS: ${{ inputs.cmake-args }}
          WORKFLOW_MAPPER_DIR: ${{ case(steps.install-vcpkg.outputs.label == 'vcpkg', 'Mapper', '') }}
        run: |
          mkdir build
          ${{ case(contains(inputs.target-triplet, 'windows'), 'cat << : | cmd /D /E:ON /V:OFF /K echo off', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), '$CALL_VCVARSALL', '') }}
          cmake -S "${WORKFLOW_MAPPER_DIR:-.}" -B build \
            -G Ninja \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${{ steps.install-vcpkg.outputs.toolchain-file }} \
            -DVCPKG_TARGET_TRIPLET=$TARGET_TRIPLET \
            -DVCPKG_HOST_TRIPLET=$HOST_TRIPLET \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg-export/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CROSSCOMPILING=${{ case(inputs.target-triplet != inputs.host-triplet, 'ON', 'OFF') }} \
            -DCMAKE_POLICY_DEFAULT_CMP0176=NEW \
            -DCMAKE_POLICY_DEFAULT_CMP0177=NEW \
            -DCMAKE_SUPPRESS_REGENERATION=ON \
            -DLICENSING_PROVIDER=vcpkg \
            ${{ case(contains(inputs.target-triplet, 'android'), '-DANDROID_DEPLOY_QT=$GITHUB_WORKSPACE/vcpkg-export/installed/$TARGET_TRIPLET/tools/qt5/bin/androiddeployqt', '') }} \
            $CMAKE_ARGS \
            || exit 1
          :

      - name: Build Mapper
        run: |
          ${{ case(contains(inputs.target-triplet, 'windows'), 'cat << : | cmd /D /E:ON /V:OFF /K echo off', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), '$CALL_VCVARSALL', '') }}
          cmake --build build \
            || exit 1
          :

      - name: Run Mapper tests
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/vcpkg-export/installed/${{ inputs.target-triplet }}/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/vcpkg-export/installed/${{ inputs.target-triplet }}/lib
          GDAL_DATA: ${{ github.workspace }}/vcpkg-export/installed/${{ inputs.target-triplet }}/share/gdal
          PROJ_DATA: ${{ github.workspace }}/vcpkg-export/installed/${{ inputs.target-triplet }}/share/proj
          TARGET_TRIPLET: ${{ inputs.target-triplet }}
          SKIP_POWERSHELL_POSITION_SOURCE_LIVE_TEST: 1
          # Needs Qt 6.5
          QT_WIN_DEBUG_CONSOLE: attach
        run: |
          ${{ case(contains(inputs.target-triplet, 'windows'), 'cat << : | cmd /D /E:ON /V:OFF /K echo off', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), 'set PATH=%GITHUB_WORKSPACE%\vcpkg-export\installed\%TARGET_TRIPLET%\bin;%PATH%', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), 'set QT_PLUGIN_PATH=%GITHUB_WORKSPACE%\vcpkg-export\installed\%TARGET_TRIPLET%\plugins', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), '$CALL_VCVARSALL', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), 'mkdir build\test\lib\fonts', '') }}
          ctest --test-dir build --output-on-failure --timeout 60 \
            || exit 1
          :

      # Separate step because the DMG unmount is unreliable
      - name: Build Mapper package
        run: |
          ${{ case(contains(inputs.target-triplet, 'windows'), 'cat << : | cmd /D /E:ON /V:OFF /K echo off', '') }}
          ${{ case(contains(inputs.target-triplet, 'windows'), '$CALL_VCVARSALL', '') }}
          cmake --build build --target package \
            || exit 1
          :

      - name: Save Mapper packages to cache
        #if: ${{ steps.workflow-configuration.outputs.WORKFLOW_LABEL 0= 'mapper' }}
        uses: actions/cache/save@v5
        with:
          path: build/OpenOrienteering-Mapper-*
          key: mapper-package_${{ steps.install-vcpkg.outputs.key }}_${{ github.run_id }}
          enableCrossOsArchive: true

      - name: Prepare private artifacts
        id: prepare-artifacts
        if: env.UPLOAD_ARTIFACTS
        env:
          ARTIFACTS_KEY: ${{ secrets.ARTIFACTS_KEY }}
        run: |
          echo "$ARTIFACTS_KEY" > artifacts-key.asc
          rm -Rf build/OpenOrienteering-Mapper-*.gpg
          for ARTIFACT in build/OpenOrienteering-Mapper-* ; do
            gpg --batch --yes --no-tty --trust-model always --recipient-file artifacts-key.asc --encrypt "$ARTIFACT"
            echo "have_artifacts=true" >> "$GITHUB_OUTPUT"
          done

      - name: Upload workflow artifacts
        if: steps.prepare-artifacts.outputs.have_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.install-vcpkg.outputs.key }}
          path: build/OpenOrienteering-Mapper-*.gpg
          compression-level: 0
          retention-days: 7

      - name: Save gradle cache
        if: contains(inputs.target-triplet, 'android') && steps.restore-gradle.outputs.cache-matched-key == ''
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ github.run_id }}
